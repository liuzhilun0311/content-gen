interface:
  display_name: "内容创作"
  short_description: "按独立开关交付完整配图正文HTML、EPUB、PDF及各平台发布内容"
  default_prompt: "使用 $content-gen 读取材料，缺失时提醒上传并自动识别格式；将任务名称和专业领域一起提问并展示实际可用领域。按已确认模板提供五列参数文档供用户填写，页首保留名称和领域，填写后校验并将原文保存在任务文件夹。按起点规划共享封面与插图；是否使用image-gen默认1，使用时调用该技能提供的渠道，不用时采用用户自行选择的方式。配图设计、提示词、自检修正复检及审核仍由content-gen负责，两项用户审核默认0；按独立开关输出content完整配图正文HTML、EPUB、PDF，知乎、公众号、CSDN各一篇完整文章以及抖音、小红书文案。长平台由内容决定篇幅，无字数目标；核对知识覆盖和图文对应，历史成果保留。"
